repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv => make sure the lock file is up-to-date
        stages: [pre-commit]
        language: system
        entry: uv lock --locked
        always_run: true
        pass_filenames: false

      - id: documentation-formatting
        name: markdownlint => markdown formatting
        stages: [pre-commit]
        language: system
        entry: uv run markdownlint --fix docs --disable MD013
        always_run: true
        pass_filenames: false

      - id: zensical-strict
        name: zensical => strict internal link check
        stages: [pre-push]
        language: system
        entry: uv run zensical build --strict
        always_run: true
        pass_filenames: false

      - id: pip-audit
        name: pip-audit => vulnerability checking
        stages: [pre-push]
        language: system
        entry: uv run pip-audit
        always_run: true
        pass_filenames: false
