[project]
name = "app-analisis-siniestralidad-docs"
version = "0.1.0"
description = "Documentación de la app de análisis de siniestralidad"
readme = "README.md"
requires-python = ">=3.12.5"
dependencies = [
    "mike",
    "zensical>=0.1.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "prek>=0.4.10",
]

[tool.uv.sources]
# Fork de mike compatible con Zensical (transitorio hasta que Zensical tenga versionamiento nativo)
mike = { git = "https://github.com/squidfunk/mike.git" }
